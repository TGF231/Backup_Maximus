; ============================================================================
;  Backup Maximus - exemplo equivalente ao BKP.bat (PDV Expresso / Firebird 2.5)
;
;  Para usar: copie este arquivo para a pasta do BackupMaximus.exe com o nome
;  backup_maximus.ini, ajuste os caminhos, e abra a aplicacao para definir a
;  senha e as senhas de banco (que NAO podem ser escritas aqui em texto plano).
;
;  IMPORTANTE sobre senhas: os campos password_enc guardam texto cifrado com
;  DPAPI, valido apenas para o usuario e a maquina que o gerou. Deixe-os vazios
;  aqui e preencha as senhas pela tela de configuracao — ela cifra sozinha.
; ============================================================================

[general]
company=Comercio Aurora Ltda
notify_email=ti@aurora.com.br
; Alerta se nao houver backup concluido nesse periodo. Rotina diaria as 22:00
; com 26 h da 2 h de folga antes de reclamar.
alert_timeout_hours=26
send_report_email=1
; Preenchidos pela aplicacao na primeira execucao:
ui_password_hash=
ui_password_salt=
; Vazio = autodetecta em C:\Program Files\7-Zip\7z.exe
sevenzip_path=

[smtp]
host=smtp.aurora.com.br
port=587
ssl=1
user=backup@aurora.com.br
; preencha pela tela de configuracao (botao Testar email valida na hora)
password_enc=
from=backup@aurora.com.br

[state]
last_run_unix=0
last_run_status=

; ---------------------------------------------------------------------------
;  CONJUNTO: gera U:\BKP_MAXIMUS<DDMMYYYYHHMMSS>.zip
;  Equivale a:  WinRAR a -agDDMMYYYYHHMM -afzip U:\BKP_MAXIMUS "C:\BACKUP"
; ---------------------------------------------------------------------------
[set.1]
name=BKP_MAXIMUS
; A arvore de montagem — o mesmo C:\BACKUP do script antigo.
staging=C:\BACKUP
; Onde o zip final e gravado (pen drive / HD externo).
destination=U:\
; full = um zip novo por execucao (compressao maxima), como o WinRAR -ag fazia.
; incremental = um unico zip fixo atualizado a cada vez (compressao rapida).
mode=full
; Espera o pen drive aparecer antes de comecar — equivale ao laco
; :VERIFICA_UNIDADE do script. Vazio = nao espera. 0 seg = espera sem limite.
wait_for_path=U:\
wait_timeout_sec=600
; Manter ligado: e o que faz a segunda execucao ser rapida (so copia o que mudou).
keep_staging=1
enabled=1

; --- Banco do PDV -----------------------------------------------------------
; Equivale a: GBAK -B -V -user SYSDBA -pas masterkey LOCALHOST:PDVEXPRESSO
;                  "C:\Backup\PDVEXPRESSO.FBK"
[item.1.1]
name=PDV Expresso (banco)
type=firebird
source=PDVEXPRESSO
subfolder=PDVEXPRESSO
output_name=PDVEXPRESSO.FBK
host=LOCALHOST
port=
user=SYSDBA
password_enc=
; Vazio = autodetecta. Firebird 2.5 fica em:
; C:\Program Files\Firebird\Firebird_2_5\bin\gbak.exe
tool_path=
enabled=1

; --- Configuracao da NFC-e --------------------------------------------------
; Equivale a: ROBOCOPY "...\nfceConfig.ini" "C:\Backup\PDVEXPRESSO"
[item.1.2]
name=Config NFC-e
type=files
source=C:\Program Files (x86)\Eagle\PDVExpresso\nfceConfig.ini
subfolder=PDVEXPRESSO
enabled=1

; --- XMLs de destinatario ---------------------------------------------------
; Equivale a: ROBOCOPY "...\XmlDestinatario" "...\XmlDestinatario" /MIR
[item.1.3]
name=XMLs destinatario
type=files
source=C:\Program Files (x86)\Eagle\PDVExpresso\Arquivos\XmlDestinatario
subfolder=PDVEXPRESSO\Arquivos\XmlDestinatario
; mirror=1 remove do backup o que foi apagado na origem (o /MIR do robocopy).
mirror=1
enabled=1

; --- Logs de transmissao ----------------------------------------------------
; Equivale a: ROBOCOPY "...\Log" "...\Log" /MIR
[item.1.4]
name=Logs de transmissao
type=files
source=C:\Program Files (x86)\Eagle\PDVExpresso\Arquivos\Log
subfolder=PDVEXPRESSO\Arquivos\Log
mirror=1
enabled=1

; --- Segundo PDV (exemplo) --------------------------------------------------
; Basta duplicar o item do banco mudando o alias e o nome do arquivo gerado.
; Deixe enabled=0 se o cliente so tem um PDV.
[item.1.5]
name=PDV Expresso 2 (banco)
type=firebird
source=PDVEXPRESSO2
subfolder=PDVEXPRESSO2
output_name=PDVEXPRESSO2.FBK
host=LOCALHOST
user=SYSDBA
password_enc=
enabled=0

; --- Sistema fiscal (exemplo) -----------------------------------------------
; No script antigo isso era comentado com REM quando o cliente nao tinha.
; Aqui basta enabled=0 — a configuracao continua registrada e reversivel.
[item.1.6]
name=Sistema Fiscal
type=firebird
source=FISCAL
subfolder=FISCAL
output_name=FISCAL.FBK
host=LOCALHOST
user=SYSDBA
password_enc=
enabled=0

; ---------------------------------------------------------------------------
;  Credencial de rede (opcional) — so se o destino for um servidor UNC.
; ---------------------------------------------------------------------------
;[netcred.1]
;unc=\\servidor\backups
;user=DOMINIO\svc_backup
;password_enc=
