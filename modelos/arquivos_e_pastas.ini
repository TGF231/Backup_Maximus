; Backup Maximus - arquivo de configuracao
; Um [set.N] produz UM arquivo .zip. Cada [item.N.M] coloca seu conteudo
; na subpasta indicada dentro da arvore de montagem, e a arvore inteira
; vira esse zip. Senhas sao cifradas com DPAPI (validas so nesta maquina).

[general]
company=
notify_email=
alert_timeout_hours=26
send_report_email=0
ui_password_hash=
ui_password_salt=
sevenzip_path=
rclone_path=
dark_theme=0
reminder_enabled=0
reminder_time=22:00

[smtp]
host=
port=587
ssl=1
user=
password_enc=
from=

[state]
last_run_unix=0
last_run_status=

[set.1]
name=ARQUIVOS
staging=
destination=D:\Backups
mode=incremental
wait_for_path=
wait_timeout_sec=300
keep_staging=1
keep_last=30
cloud_remote=
cloud_path=
cloud_keep_last=0
enabled=1

[item.1.1]
name=Documentos
type=files
source=C:\Users\Publico\Documentos
subfolder=Documentos
output_name=
mirror=1
host=
port=
user=
password_enc=
tool_path=
enabled=1

[item.1.2]
name=Pasta na rede
type=files
source=\\SERVIDOR\Compartilhada
subfolder=Rede
output_name=
mirror=1
host=
port=
user=
password_enc=
tool_path=
enabled=1
