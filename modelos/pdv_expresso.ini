; Backup Maximus - arquivo de configuracao
; Um [set.N] produz UM arquivo .zip. Cada [item.N.M] coloca seu conteudo
; na subpasta indicada dentro da arvore de montagem, e a arvore inteira
; vira esse zip. Senhas sao cifradas com DPAPI (validas so nesta maquina).

[general]
company=
notify_email=
alert_timeout_hours=26
send_report_email=0
ui_password_hash=
ui_password_salt=
sevenzip_path=
rclone_path=
dark_theme=0
reminder_enabled=0
reminder_time=22:00

[smtp]
host=
port=587
ssl=1
user=
password_enc=
from=

[state]
last_run_unix=0
last_run_status=

[set.1]
name=PDV_EXPRESSO
staging=C:\BACKUP
destination=U:\
mode=full
wait_for_path=U:\
wait_timeout_sec=600
keep_staging=1
keep_last=7
cloud_remote=
cloud_path=
cloud_keep_last=0
enabled=1

[item.1.1]
name=Banco PDV Expresso
type=firebird
source=PDVEXPRESSO
subfolder=PDVEXPRESSO
output_name=PDVEXPRESSO.FBK
mirror=1
host=LOCALHOST
port=3050
user=SYSDBA
password_enc=
tool_path=
enabled=1

[item.1.2]
name=Configuracao NFC-e
type=files
source=C:\Program Files (x86)\Eagle\PDVExpresso\nfceConfig.ini
subfolder=PDVEXPRESSO
output_name=
mirror=1
host=
port=
user=
password_enc=
tool_path=
enabled=1

[item.1.3]
name=XMLs do destinatario
type=files
source=C:\Program Files (x86)\Eagle\PDVExpresso\Arquivos\XmlDestinatario
subfolder=PDVEXPRESSO\Arquivos\XmlDestinatario
output_name=
mirror=1
host=
port=
user=
password_enc=
tool_path=
enabled=1

[item.1.4]
name=Logs de transmissao
type=files
source=C:\Program Files (x86)\Eagle\PDVExpresso\Arquivos\Log
subfolder=PDVEXPRESSO\Arquivos\Log
output_name=
mirror=1
